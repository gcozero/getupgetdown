<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Exchange</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #winScreen {
      align-items: center;
      background: linear-gradient(135deg, #143d2b, #257a4d);
      color: white;
      display: flex;
      inset: 0;
      justify-content: center;
      padding: 2rem;
      position: fixed;
      text-align: center;
    }

    #winScreen[hidden] {
      display: none;
    }

    #winScreen h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      margin: 0;
    }
  </style>
</head>
<body>
  <h2>Enter your code to get a new code</h2>
  <input type="text" id="inputCode" placeholder="Type code here">
  <button onclick="exchangeCode()">Get New Code</button>
  <p>New Code: <span id="outputCode">---</span></p>
  <main id="winScreen" aria-live="polite" hidden>
    <h1>You win! Please screenshot this and send this to me to get your prize :D</h1>
  </main>

  <script>
    // A simple dictionary of code pairs
    const codeMap = {
      "CODE123": "XYZ-999",
      "HELLO": "WORLD-001",
      "TEST": "PASS-404"
    };

    function exchangeCode() {
      const userVal = document.getElementById("inputCode").value.trim();
      if (userVal === "443444535") {
        document.getElementById("winScreen").hidden = false;
        return;
      }

      const result = codeMap[userVal] ? codeMap[userVal] : "Invalid or unknown code";
      document.getElementById("outputCode").innerText = result;
    }
  </script>
</body>
</html>
