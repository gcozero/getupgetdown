<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Exchange</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: linear-gradient(135deg, #eef4f1, #dce9e3);
      color: #18352b;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .exchange-card {
      background: #fff;
      border: 1px solid #dce8e1;
      border-radius: 1.25rem;
      box-shadow: 0 1.25rem 3.5rem #18352b1a;
      max-width: 30rem;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      width: 100%;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      letter-spacing: -0.04em;
      line-height: 1.2;
      margin: 0 0 0.6rem;
    }

    .description {
      color: #60746a;
      line-height: 1.5;
      margin: 0 0 1.75rem;
    }

    #attemptStatus {
      color: #60746a;
      font-size: 0.9rem;
      margin: 0.9rem 0 0;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .code-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    input,
    button {
      border-radius: 0.7rem;
      font: inherit;
      min-height: 3rem;
    }

    input {
      background: #fbfdfb;
      border: 1px solid #cbd9d0;
      color: inherit;
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.75rem 0.9rem;
    }

    input:focus {
      border-color: #28744d;
      outline: 3px solid #28744d2b;
    }

    button {
      background: #216a45;
      border: 0;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      padding: 0.75rem 1rem;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #174f34;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #28744d66;
      outline-offset: 3px;
    }

    .result {
      border-top: 1px solid #e5ece7;
      margin: 1.75rem 0 0;
      padding-top: 1.25rem;
    }

    .result-label {
      color: #60746a;
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    #outputCode {
      background: #f0f6f2;
      border: 1px solid #e0ebe4;
      border-radius: 0.65rem;
      color: #216a45;
      display: block;
      font-family: Consolas, "Courier New", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      min-height: 3rem;
      overflow-wrap: anywhere;
      padding: 0.8rem 0.9rem;
    }

    @media (max-width: 26rem) {
      .code-form button {
        flex-basis: 100%;
      }
    }

    #winScreen {
      align-items: center;
      background: linear-gradient(135deg, #143d2b, #257a4d);
      box-sizing: border-box;
      color: white;
      display: flex;
      inset: 0;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 4rem);
      position: fixed;
      text-align: center;
      z-index: 1;
    }

    #winScreen[hidden] {
      display: none;
    }

    #winScreen h1 {
      font-size: clamp(2rem, 8vw, 4.5rem);
      margin: 0;
      max-width: 16ch;
    }
  </style>
</head>
<body>
  <main class="exchange-card">
    <h1>Final part....</h1>
    <p class="description">Enter your code to reveal your new code. You have 3 tries.</p>
    <form class="code-form" onsubmit="exchangeCode(); return false;">
      <div>
        <label for="inputCode">Your code</label>
        <input type="text" id="inputCode" placeholder="Type code here" autocomplete="off">
      </div>
      <button type="submit">Get New Code</button>
    </form>
    <p id="attemptStatus" role="status" aria-live="polite">3 tries remaining.</p>
    <p class="result">
      <span class="result-label">New code</span>
      <span id="outputCode" aria-live="polite">---</span>
    </p>
  </main>
  <main id="winScreen" aria-live="polite" hidden>
    <h1>You win! Please screenshot this and send this to me to get your prize :D</h1>
  </main>

  <script>
    // A simple dictionary of code pairs
    const codeMap = {
      "CODE123": "XYZ-999",
      "HELLO": "WORLD-001",
      "TEST": "PASS-404"
    };

    const maxAttempts = 3;
    const attemptStorageKey = "codeExchange.failedAttempts";
    const inputCode = document.getElementById("inputCode");
    const attemptStatus = document.getElementById("attemptStatus");
    const outputCode = document.getElementById("outputCode");
    const submitButton = document.querySelector(".code-form button");
    let failedAttempts = 0;

    function lockForm(message) {
      inputCode.disabled = true;
      submitButton.disabled = true;
      attemptStatus.textContent = message;
      outputCode.textContent = "Locked";
    }

    function updateAttemptStatus() {
      const remainingAttempts = maxAttempts - failedAttempts;
      attemptStatus.textContent = `${remainingAttempts} ${remainingAttempts === 1 ? "try" : "tries"} remaining.`;
    }

    try {
      const storedAttempts = localStorage.getItem(attemptStorageKey);
      if (storedAttempts !== null) {
        const parsedAttempts = Number(storedAttempts);
        if (!Number.isInteger(parsedAttempts) || parsedAttempts < 0 || parsedAttempts > maxAttempts) {
          throw new Error("Saved attempt count is invalid.");
        }
        failedAttempts = parsedAttempts;
      }

      if (failedAttempts >= maxAttempts) {
        lockForm("No tries remaining. This code entry is locked.");
      } else {
        updateAttemptStatus();
      }
    } catch (error) {
      lockForm("Could not load saved attempts. Code entry is locked.");
      console.error("Unable to load saved code-entry attempts.", error);
    }

    function exchangeCode() {
      if (failedAttempts >= maxAttempts || inputCode.disabled) {
        return;
      }

      const userVal = inputCode.value.trim();
      if (userVal === "443444535") {
        document.getElementById("winScreen").hidden = false;
        return;
      }

      const result = codeMap[userVal];
      if (result) {
        outputCode.textContent = result;
        return;
      }

      failedAttempts += 1;
      try {
        localStorage.setItem(attemptStorageKey, String(failedAttempts));
      } catch (error) {
        lockForm("Could not save attempts. Code entry is locked.");
        console.error("Unable to save code-entry attempts.", error);
        return;
      }

      if (failedAttempts >= maxAttempts) {
        lockForm("No tries remaining. This code entry is locked.");
        outputCode.textContent = "Invalid code. This code entry is now locked.";
        return;
      }

      updateAttemptStatus();
      outputCode.textContent = `Invalid or unknown code. ${maxAttempts - failedAttempts} tries remaining.`;
    }
  </script>
</body>
</html>
